name: GoStyle k6 Performance & Security Tests

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: "Select which k6 test to run"
        required: true
        default: "load"
        type: choice
        options:
          - load
          - security
          - both

jobs:
  k6-tests:
    name: Run GoStyle k6 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ============================================
      # CHECKOUT
      # ============================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================
      # INSTALL K6
      # ============================================

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      # ============================================
      # VERIFY K6
      # ============================================

      - name: Check k6 Version
        run: k6 version

      # ============================================
      # VERIFY REQUIRED SECRETS
      # ============================================

      - name: Verify GitHub Secrets
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          EMAIL: ${{ secrets.GOSTYLE_EMAIL }}
          PASSWORD: ${{ secrets.GOSTYLE_PASSWORD }}
        run: |
          echo "Checking required environment variables..."

          if [ -z "$BASE_URL" ]; then
            echo "ERROR: BASE_URL secret is missing"
            exit 1
          fi

          if [ -z "$EMAIL" ]; then
            echo "ERROR: GOSTYLE_EMAIL secret is missing"
            exit 1
          fi

          if [ -z "$PASSWORD" ]; then
            echo "ERROR: GOSTYLE_PASSWORD secret is missing"
            exit 1
          fi

          echo "BASE_URL configured"
          echo "EMAIL configured"
          echo "PASSWORD configured"

      # ============================================
      # LOAD TEST
      # ============================================

      - name: Run Admin Login Load Test
        if: ${{ inputs.test_type == 'load' || inputs.test_type == 'both' }}
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          EMAIL: ${{ secrets.GOSTYLE_EMAIL }}
          PASSWORD: ${{ secrets.GOSTYLE_PASSWORD }}
        run: |
          echo "======================================"
          echo "Starting GoStyle Admin Load Test"
          echo "======================================"

          k6 run admin-login-test.js

      # ============================================
      # UPLOAD LOAD TEST REPORT
      # ============================================

      - name: Upload Load Test Report
        if: ${{ always() && (inputs.test_type == 'load' || inputs.test_type == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: gostyle-k6-load-test-report
          path: |
            k6-load-report.html
            k6-load-summary.json
          if-no-files-found: warn
          retention-days: 30

      # ============================================
      # SECURITY TEST
      # ============================================

      - name: Run Admin Login Security Test
        if: ${{ inputs.test_type == 'security' || inputs.test_type == 'both' }}
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          EMAIL: ${{ secrets.GOSTYLE_EMAIL }}

          # Security test uses an intentionally wrong
          # password internally.
          WRONG_PASSWORD: InvalidSecurityTestPassword123!

        run: |
          echo "======================================"
          echo "Starting GoStyle Admin Security Test"
          echo "======================================"

          k6 run gostyle-admin-login-security-test.js

      # ============================================
      # UPLOAD SECURITY TEST REPORT
      # ============================================

      - name: Upload Security Test Report
        if: ${{ always() && (inputs.test_type == 'security' || inputs.test_type == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: gostyle-k6-security-test-report
          path: |
            k6-security-report.html
            k6-security-summary.json
          if-no-files-found: warn
          retention-days: 30

      # ============================================
      # SHOW GENERATED FILES
      # ============================================

      - name: Show Generated Reports
        if: always()
        run: |
          echo "======================================"
          echo "Generated Report Files"
          echo "======================================"

          ls -lah *.html *.json 2>/dev/null || true

      # ============================================
      # FINAL MESSAGE
      # ============================================

      - name: Test Completed
        if: always()
        run: |
          echo "======================================"
          echo "GoStyle k6 Test Completed"
          echo "======================================"

          echo "Selected Test: ${{ inputs.test_type }}"
          echo ""

          if [ "${{ inputs.test_type }}" = "load" ]; then
            echo "Load Test Reports:"
            echo "- k6-load-report.html"
            echo "- k6-load-summary.json"
          fi

          if [ "${{ inputs.test_type }}" = "security" ]; then
            echo "Security Test Reports:"
            echo "- k6-security-report.html"
            echo "- k6-security-summary.json"
          fi

          if [ "${{ inputs.test_type }}" = "both" ]; then
            echo "Load Test Reports:"
            echo "- k6-load-report.html"
            echo "- k6-load-summary.json"
            echo ""
            echo "Security Test Reports:"
            echo "- k6-security-report.html"
            echo "- k6-security-summary.json"
          fi

          echo ""
          echo "Download the reports from the Artifacts section."